<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totem Hotel IA</title>
<!-- Biblioteca de Ícones (FontAwesome) para os botões -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    /* Fundo com leve gradiente azulado parecido com a foto */
    background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
    height: 100vh;
    overflow: hidden;
    color: #1e293b;
  }

  /* O contêiner principal que divide a tela em duas partes */
  .container {
    display: flex;
    height: 100vh;
    padding: 40px;
    gap: 40px;
  }

  /* --- COLUNA ESQUERDA --- */
  .left-panel {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 20px;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 30px;
  }

  .logo-area i {
    font-size: 50px;
    color: #0369a1;
  }

  .logo-area h1 {
    font-size: 28px;
    color: #0369a1;
    margin-top: 5px;
    letter-spacing: 2px;
  }

  .welcome-text {
    text-align: center;
    margin-bottom: 30px;
  }

  .welcome-text h2 {
    font-size: 26px;
    color: #0f172a;
    margin-bottom: 5px;
  }

  .welcome-text p {
    font-size: 18px;
    color: #475569;
  }

  /* Botões principais */
  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .btn {
    background-color: #0284c7;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px 25px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.1s, background-color 0.2s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn:hover {
    background-color: #0369a1;
  }

  .btn-icon {
    font-size: 28px;
    width: 40px;
    text-align: center;
  }

  .btn-text h3 {
    font-size: 20px;
    margin-bottom: 3px;
    font-weight: 600;
  }

  .btn-text p {
    font-size: 14px;
    opacity: 0.9;
    font-weight: 300;
  }

  /* --- COLUNA DIREITA --- */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
  }

  .hotel-image {
    width: 100%;
    height: 60%;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }

  /* Área do Robô */
  .robot-area {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    align-items: flex-end;
    gap: 15px;
  }

  .robot-icon {
    font-size: 80px;
    color: #0284c7;
    background: white;
    border-radius: 50%;
    padding: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .speech-bubble {
    background: #0284c7;
    color: white;
    padding: 15px 20px;
    border-radius: 20px;
    border-bottom-right-radius: 0;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  /* Esconde as telas secundárias no início */
  .screen { display: none; }
  .active-screen { display: flex; }

</style>
</head>
<body>

<!-- TELA PRINCIPAL COM O DESIGN DA FOTO -->
<div id="home" class="container screen active-screen">
  
  <div class="left-panel">
    <div class="logo-area">
      <i class="fa-solid fa-bed"></i>
      <h1>HOTEL</h1>
    </div>

    <div class="welcome-text">
      <h2>Olá, seja bem-vindo!</h2>
      <p>Como podemos te ajudar hoje?</p>
    </div>

    <div class="menu-buttons">
      <button class="btn" onclick="alert('Indo para Check-in...')">
        <div class="btn-icon"><i class="fa-solid fa-user"></i></div>
        <div class="btn-text">
          <h3>Check-in</h3>
          <p>Faça seu check-in de forma rápida e fácil</p>
        </div>
      </button>

      <button class="btn" onclick="alert('Indo para Check-out...')">
        <div class="btn-icon"><i class="fa-solid fa-suitcase"></i></div>
        <div class="btn-text">
          <h3>Check-out</h3>
          <p>Finalize sua estadia</p>
        </div>
      </button>

      <button class="btn" onclick="alert('Indo para Informações...')">
        <div class="btn-icon"><i class="fa-solid fa-circle-info"></i></div>
        <div class="btn-text">
          <h3>Informações</h3>
          <p>Tire suas dúvidas sobre o hotel</p>
        </div>
      </button>

      <button class="btn" onclick="dispararAlarme()" style="background-color: #0f172a;">
        <div class="btn-icon"><i class="fa-solid fa-headset"></i></div>
        <div class="btn-text">
          <h3>Falar com a recepção</h3>
          <p>Precisa de ajuda? Fale com um atendente</p>
        </div>
      </button>
    </div>
  </div>

  <div class="right-panel">
    <!-- Imagem demonstrativa de uma recepção (você pode trocar pelo link de uma foto do projeto de vocês) -->
    <img src="https://images.unsplash.com/photo-1562790351-d273a961e0e9?q=80&w=800&auto=format&fit=crop" alt="Recepção do Hotel" class="hotel-image">
    
    <div class="robot-area">
      <div class="speech-bubble">Estamos aqui<br>para te atender!</div>
      <div class="robot-icon"><i class="fa-solid fa-robot"></i></div>
    </div>
  </div>

</div>

<script>
  function dispararAlarme() {
    alert("🚨 ALERTA ENVIADO! O dispositivo da recepção está tocando.");
    // Aqui entra o código de comunicação (WebSocket, Fetch ou BroadcastChannel)
    // que discutimos na mensagem anterior.
  }
</script>

</body>
</html>
